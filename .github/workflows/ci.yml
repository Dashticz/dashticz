name: CI

on:
  push:
    branches: [develop, test]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_integrations:
        description: Run tests against configured live services
        required: false
        default: false
        type: boolean
      update_snapshots:
        description: Regenerate Playwright screenshot baselines and commit them
        required: false
        default: false
        type: boolean
      update_snapshots_spec:
        description: Spec file to regenerate snapshots for (update_snapshots only)
        required: false
        default: tests/domoticzblock.spec.js
        type: string
      update_snapshots_browser:
        description: Browser project to regenerate snapshots for (update_snapshots only)
        required: false
        default: chromium
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none
      - run: php --version
      - run: php -m | grep -qi '^curl$'
      - run: node --test tests/php-security.test.js

  browsers:
    name: Playwright ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start PHP test server
        run: |
          php -S 127.0.0.1:8082 -t . > php-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8082/ >/dev/null && exit 0
            sleep 1
          done
          cat php-server.log
          exit 1
      - run: npx playwright test --project=${{ matrix.browser }}
        env:
          DASHTICZ_TEST_URL: http://127.0.0.1:8082
          DASHTICZ_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            php-server.log
          retention-days: 7

  update-snapshots:
    name: Update Playwright snapshots
    if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ inputs.update_snapshots_browser }}
      - name: Start PHP test server
        run: |
          php -S 127.0.0.1:8082 -t . > php-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8082/ >/dev/null && exit 0
            sleep 1
          done
          cat php-server.log
          exit 1
      - run: npx playwright test --project=${{ inputs.update_snapshots_browser }} ${{ inputs.update_snapshots_spec }} --update-snapshots
        env:
          DASHTICZ_TEST_URL: http://127.0.0.1:8082
          DASHTICZ_BROWSER: ${{ inputs.update_snapshots_browser }}
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '**/*-snapshots/*.png'
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git diff --cached --stat
            git commit -m "Update Playwright ${{ inputs.update_snapshots_browser }} snapshots for ${{ inputs.update_snapshots_spec }}"
            git push
          fi

  live-integrations:
    name: Live integrations
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_integrations
    runs-on: ubuntu-latest
    environment: live-integrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Require at least one configured live integration
        run: test -n "${DASHTICZ_LIVE_DOMOTICZ_URL}${DASHTICZ_LIVE_LMS_HOST}${DASHTICZ_LIVE_ICAL_URL}"
        env:
          DASHTICZ_LIVE_DOMOTICZ_URL: ${{ secrets.DASHTICZ_LIVE_DOMOTICZ_URL }}
          DASHTICZ_LIVE_LMS_HOST: ${{ secrets.DASHTICZ_LIVE_LMS_HOST }}
          DASHTICZ_LIVE_ICAL_URL: ${{ secrets.DASHTICZ_LIVE_ICAL_URL }}
      - name: Start PHP test server
        run: |
          php -S 127.0.0.1:8082 -t . > php-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8082/ >/dev/null && exit 0
            sleep 1
          done
          cat php-server.log
          exit 1
        env:
          DASHTICZ_ALLOWED_REMOTE_HOSTS: ${{ secrets.DASHTICZ_ALLOWED_REMOTE_HOSTS }}
      - run: npm run test:live
        env:
          DASHTICZ_TEST_URL: http://127.0.0.1:8082
          DASHTICZ_BROWSER: chromium
          DASHTICZ_ALLOWED_REMOTE_HOSTS: ${{ secrets.DASHTICZ_ALLOWED_REMOTE_HOSTS }}
          DASHTICZ_LIVE_DOMOTICZ_URL: ${{ secrets.DASHTICZ_LIVE_DOMOTICZ_URL }}
          DASHTICZ_LIVE_DOMOTICZ_USERNAME: ${{ secrets.DASHTICZ_LIVE_DOMOTICZ_USERNAME }}
          DASHTICZ_LIVE_DOMOTICZ_PASSWORD: ${{ secrets.DASHTICZ_LIVE_DOMOTICZ_PASSWORD }}
          DASHTICZ_LIVE_LMS_HOST: ${{ secrets.DASHTICZ_LIVE_LMS_HOST }}
          DASHTICZ_LIVE_LMS_PORT: ${{ secrets.DASHTICZ_LIVE_LMS_PORT }}
          DASHTICZ_LIVE_LMS_USERNAME: ${{ secrets.DASHTICZ_LIVE_LMS_USERNAME }}
          DASHTICZ_LIVE_LMS_PASSWORD: ${{ secrets.DASHTICZ_LIVE_LMS_PASSWORD }}
          DASHTICZ_LIVE_ICAL_URL: ${{ secrets.DASHTICZ_LIVE_ICAL_URL }}
