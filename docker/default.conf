server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html index.htm;

    # The compose setup bind-mounts the complete checkout as the web root.
    # Never expose repository metadata, local environment files or other
    # dotfiles through Nginx. ACME challenges remain available for HTTPS
    # frontends that share this document root.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        return 404;
    }

    # Serve static files directly. Missing files must return a real 404:
    # the first-run setup detects an absent custom/CONFIG.js by its 404, and
    # an index.html fallback would be evaluated as JavaScript instead.
    location / {
        try_files $uri $uri/ =404;
    }

    # Composer sources, examples and maintenance tools are runtime include
    # files, never public HTTP entry points.
    location ^~ /vendor/dashticz/ical/vendor/ {
        return 404;
    }

    # Server-side caches of the PHP proxies (PostNL refresh tokens among
    # them) are never served. vendor/custom/ is where earlier versions wrote
    # some of them by mistake.
    location ^~ /custom/cache/ {
        return 404;
    }
    location ^~ /vendor/custom/ {
        return 404;
    }

    # Caching. Scripts, stylesheets, templates and JSON always revalidate
    # (the ETag nginx adds makes that a small 304 answer when nothing changed),
    # so an update or a same-day fix is never hidden behind a stale cached copy.
    # Fonts never change under the same name and are cached for a month.
    # Images and sounds can be replaced by the user under the same name, so
    # they are cached for one day.
    location ~* \.(?:js|css|json|tpl|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|mp3|wav|ogg)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
