# Scrutinizer CI (https://scrutinizer-ci.com): static quality and security
# analysis of the PHP and JavaScript code. Scrutinizer reports its result as a
# check on every push and pull request once the repository is added there.
build:
  # Node 22 needs a newer glibc than the older default build images have,
  # so the Ubuntu 22.04 image is used.
  image: default-jammy
  environment:
    php: 8.3
    node: v22
  dependencies:
    # Scrutinizer finds phpunit.xml.dist and runs `phpunit`, which its image
    # does not have, so the PHPUnit PHAR is downloaded first.
    override:
      - mkdir -p "$HOME/bin"
      - wget -q -O "$HOME/bin/phpunit" https://phar.phpunit.de/phpunit-12.phar
      - chmod +x "$HOME/bin/phpunit"
  tests:
    override:
      - '"$HOME/bin/phpunit"'
  nodes:
    analysis:
      tests:
        override:
          - php-scrutinizer-run
          - js-scrutinizer-run

filter:
  excluded_paths:
    # Built bundle and third-party code.
    - 'dist/*'
    - 'node_modules/*'
    - 'vendor/dashticz/ical/vendor/*'
    - 'vendor/*.js'
    - 'vendor/weather/*'
    - 'font/*'
    # Documentation (Sphinx theme) and tests.
    - 'docs/*'
    - 'tests/*'
    # Per-installation content.
    - 'custom/*'

checks:
  php: true
  javascript: true

tools:
  external_code_coverage: false
